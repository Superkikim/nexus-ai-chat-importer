name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build plugin
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Extract release notes body
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 << 'EOF' > /tmp/release-body.md
          import re, os
          version = os.environ['RELEASE_VERSION']
          with open('RELEASE_NOTES.md') as f:
              text = f.read()
          m = re.search(
              rf'^(## Version {re.escape(version)}.*?)(?=^## Version |\Z)',
              text, re.MULTILINE | re.DOTALL
          )
          print(m.group(1).rstrip().rstrip('-').strip() if m else '')
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
          generate_release_notes: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
